[package]
name = "blendtest"
version = "0.1.0"
edition = "2024"

# The same versions as Krust (C:\unwork\mmo\Cargo.toml), so the renderer ports over unchanged.
[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.36", default-features = false }
egui-winit = { version = "0.36", default-features = false }
glam = "0.34"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1.0"
wgpu = "30.0"
winit = "0.30.13"

[dev-dependencies]
# The WGSL front end wgpu 30 uses, to validate the shader without a GPU.
naga = { version = "30.0", features = ["wgsl-in"] }
